name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: kubernetes-production-lab

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff
        run: pip install ruff && ruff check backend scripts
      - name: Compile
        run: python -m py_compile backend/main.py
      - name: Unit tests (metrics)
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pytest -q backend/tests

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Render base and self-managed overlay
        run: |
          cp manifests/overlays/self-managed/secrets.env.example manifests/overlays/self-managed/secrets.env
          kubectl kustomize manifests/base > /tmp/base.yaml
          kubectl kustomize manifests/overlays/self-managed > /tmp/overlay.yaml
      - name: Validate schemas (incl. HPA autoscaling/v2 and PDB policy/v1)
        run: kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/base.yaml /tmp/overlay.yaml
      - name: Check HPA / Deployment / PDB fit together
        run: |
          pip install pyyaml
          for f in /tmp/base.yaml /tmp/overlay.yaml; do
            python scripts/check_autoscaling.py < "$f"
          done

  observability:
    name: Alert rules, dashboard and monitoring manifests
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/rules:ro" --entrypoint promtool \
            "$PROMETHEUS_IMAGE" check rules /rules/alerts.yml
      - name: promtool test rules (alert unit tests)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool \
            "$PROMETHEUS_IMAGE" test rules alerts_test.yml
      - name: promtool check config (compose Prometheus)
        run: |
          docker run --rm \
            -v "$PWD/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observability/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: PrometheusRule matches alerts.yml
        run: |
          pip install pyyaml
          python scripts/check_prometheusrule.py
      - name: Dashboard JSON is valid
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("dashboards/backend.json"))
          assert d["uid"] and d["panels"], "dashboard needs a uid and panels"
          print(f"OK: {d['title']} ({len(d['panels'])} panels)")
          PY
      - name: Validate monitoring manifests (CRD schemas)
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubectl kustomize manifests/monitoring > /tmp/monitoring.yaml
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/monitoring.yaml

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t production-lab-${{ matrix.image }}:ci ${{ matrix.image }}

  compose-smoke:
    name: End-to-end smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start stack (incl. Prometheus + Grafana)
        run: docker compose --profile observability up -d --build
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Frontend proxies to backend and database
        run: |
          curl -fsS http://localhost:8081/health
          curl -fsS http://localhost:8081/api/database | grep -q "Backend and PostgreSQL are working"
      - name: Prometheus metrics
        run: |
          curl -fsS http://localhost:8080/metrics > /tmp/metrics.txt
          grep -E '^database_up 1(\.0)?$' /tmp/metrics.txt
          grep -q 'http_requests_total{method="GET",route="/api/database",status="200"}' /tmp/metrics.txt
          grep -q 'http_request_duration_seconds_count{method="GET",route="/api/health/ready"}' /tmp/metrics.txt
          # /metrics must not be reachable through the public frontend/ingress path.
          if curl -fsS http://localhost:8081/metrics | grep -q http_requests_total; then
            echo "/metrics is exposed through the frontend" && exit 1
          fi
      - name: Prometheus scrapes the backend and loaded the alert rules
        run: |
          for i in $(seq 1 30); do
            curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22backend%22%7D' \
              | grep -q '"value":\[[0-9.]*,"1"\]' && break
            [ "$i" = 30 ] && { curl -s http://localhost:9090/api/v1/targets; exit 1; }
            sleep 2
          done
          curl -fsS http://localhost:9090/api/v1/rules > /tmp/rules.json
          for a in BackendDown HighErrorRate HighLatency; do grep -q "\"name\":\"$a\"" /tmp/rules.json; done
      - name: Grafana has the provisioned dashboard
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            [ "$i" = 30 ] && { docker compose logs grafana; exit 1; }
            sleep 2
          done
          curl -fsS http://localhost:3000/api/dashboards/uid/production-lab-backend | grep -q '"title":"Production lab / Backend"'
          curl -fsS 'http://localhost:3000/api/datasources/uid/prometheus/health' | grep -q '"status":"OK"'
      - name: k6 load test (20 VUs, p95 < 500ms, errors < 1%)
        run: |
          docker run --rm -i --network host -e BASE_URL=http://localhost:8081 \
            grafana/k6:1.3.0 run --quiet - < tests/load/smoke.js
      - name: Logs on failure
        if: failure()
        run: docker compose --profile observability logs
      - name: Tear down
        if: always()
        run: docker compose --profile observability down -v
