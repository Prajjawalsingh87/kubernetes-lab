# Local Prometheus for `docker compose --profile observability up`.
# Scrapes the backend's /metrics (not exposed through the frontend) and loads
# the same alert rules that CI validates with promtool.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # job="backend" matches the in-cluster ServiceMonitor (job = Service name),
  # so the alert rules and dashboard queries work in both places.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
