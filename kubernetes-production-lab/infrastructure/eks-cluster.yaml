apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: production-lab
  region: ap-south-1
  version: "1.36"

availabilityZones:
  - ap-south-1a
  - ap-south-1b
  - ap-south-1c

iam:
  withOIDC: true

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  # Two application workers are the highly available baseline. Cluster
  # Autoscaler may grow this group when HPA creates unschedulable pods.
  - name: application-workers
    instanceType: t3.medium
    amiFamily: AmazonLinux2023
    disableIMDSv1: true
    volumeType: gp3
    volumeSize: 40
    volumeEncrypted: true
    minSize: 2
    desiredCapacity: 2
    maxSize: 6
    privateNetworking: true
    labels:
      workload: application
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/production-lab: owned
    updateConfig:
      maxUnavailable: 1

  # One dedicated database worker makes the initial total exactly 3 workers.
  # It is fixed-size so the node autoscaler cannot remove the database node.
  - name: postgres-worker
    instanceType: t3.medium
    amiFamily: AmazonLinux2023
    disableIMDSv1: true
    volumeType: gp3
    volumeSize: 50
    volumeEncrypted: true
    minSize: 1
    desiredCapacity: 1
    maxSize: 1
    privateNetworking: true
    availabilityZones:
      - ap-south-1a
    labels:
      workload: postgres
    taints:
      - key: dedicated
        value: postgres
        effect: NoSchedule
    updateConfig:
      maxUnavailable: 1
