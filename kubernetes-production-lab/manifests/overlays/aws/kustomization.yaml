apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: ingress-patch.yaml
secretGenerator:
  - name: database-credentials
    namespace: production-lab
    envs:
      - secrets.env
images:
  - name: FRONTEND_IMAGE
    newName: AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/production-lab-frontend
    newTag: IMAGE_TAG
  - name: BACKEND_IMAGE
    newName: AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/production-lab-backend
    newTag: IMAGE_TAG
