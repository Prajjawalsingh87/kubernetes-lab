# Optional monitoring add-on (requires the Prometheus Operator CRDs).
# Deliberately not referenced from manifests/base or any overlay, so the
# default `kubectl apply -k` never needs monitoring.coreos.com.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
  - prometheusrule.yaml
