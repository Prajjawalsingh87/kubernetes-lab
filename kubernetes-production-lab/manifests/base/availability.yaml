# Voluntary-disruption budgets (node drains, cluster upgrades, Cluster
# Autoscaler scale-down). The backend HPA keeps minReplicas: 2, so one backend
# Pod can always be evicted while the other keeps serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: production-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: production-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend

