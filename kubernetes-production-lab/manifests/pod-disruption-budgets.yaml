---
# Frontend PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: production
  labels:
    app: frontend
spec:
  minAvailable: 1          # At least 1 frontend pod must always be running
  selector:
    matchLabels:
      app: frontend

---
# Backend PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: production
  labels:
    app: backend
spec:
  minAvailable: 2          # At least 2 backend pods must always be running
  selector:
    matchLabels:
      app: backend

---
# PostgreSQL PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: production
  labels:
    app: postgres
spec:
  maxUnavailable: 0        # Never allow postgres pod to be voluntarily disrupted
  selector:
    matchLabels:
      app: postgres
