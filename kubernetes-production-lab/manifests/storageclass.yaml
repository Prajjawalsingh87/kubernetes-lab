apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3              # AWS EBS gp3 volume type
  iops: "3000"           # IOPS for gp3
  throughput: "125"      # MB/s throughput
  encrypted: "true"      # Enable EBS encryption
  fsType: ext4
reclaimPolicy: Retain     # Keep data even when PVC is deleted
volumeBindingMode: WaitForFirstConsumer  # Bind only when pod is scheduled
allowVolumeExpansion: true  # Allow resizing volumes
