apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: production
  labels:
    app: postgres
    tier: database
spec:
  accessModes:
    - ReadWriteOnce       # Single node read-write (suitable for DB)
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 20Gi       # 20GB for PostgreSQL data
